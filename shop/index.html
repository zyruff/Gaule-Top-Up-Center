<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Coin Shop</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-pink: #fe2c55;
            --accent-cyan: #25f4ee;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2f2f2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-pink);
        }

        .user-id-section {
            background: var(--card-bg);
            margin: 20px auto;
            max-width: 600px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .user-id-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            background: #2b2b2b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        @media (max-width: 480px) {
            .coins-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .coin-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .coin-card:hover {
            border-color: var(--accent-cyan);
        }

        .coin-card.selected {
            border-color: var(--accent-pink);
            background: rgba(254, 44, 85, 0.05);
        }

        .coin-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
        }

        .coin-amount {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .coin-price {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .checkout-box {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .total-price span {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .total-price strong {
            font-size: 18px;
            color: var(--accent-cyan);
        }

        .checkout-btn {
            background: linear-gradient(45deg, var(--accent-pink), #ff3b5c);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TikTok <span>Coins</span></div>
    </header>

    <div class="container">
        <!-- User ID Input Section -->
        <div class="user-id-section">
            <h3>Enter TikTok User ID</h3>
            <div class="input-group">
                <input type="text" id="userId" placeholder="e.g. username123">
            </div>
        </div>

        <!-- Coin Packages -->
        <h3 class="section-title">Select Coin Package</h3>
        <div class="coins-grid">
            <div class="coin-card" onclick="selectPackage(this, '30 Coins', 'Rs. 75')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">30 Coins</div>
                <div class="coin-price">Rs. 75</div>
            </div>
            <div class="coin-card" onclick="selectPackage(this, '70 Coins', 'Rs. 175')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">70 Coins</div>
                <div class="coin-price">Rs. 175</div>
            </div>
            <div class="coin-card" onclick="selectPackage(this, '350 Coins', 'Rs. 875')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">350 Coins</div>
                <div class="coin-price">Rs. 875</div>
            </div>
            <div class="coin-card" onclick="selectPackage(this, '700 Coins', 'Rs. 1,750')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">700 Coins</div>
                <div class="coin-price">Rs. 1,750</div>
            </div>
            <div class="coin-card" onclick="selectPackage(this, '1400 Coins', 'Rs. 3,500')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">1,400 Coins</div>
                <div class="coin-price">Rs. 3,500</div>
            </div>
            <div class="coin-card" onclick="selectPackage(this, '3500 Coins', 'Rs. 8,750')">
                <div class="coin-icon">🪙</div>
                <div class="coin-amount">3,500 Coins</div>
                <div class="coin-price">Rs. 8,750</div>
            </div>
        </div>
    </div>

    <!-- Bottom Checkout Bar -->
    <div class="checkout-box">
        <div class="total-price">
            <span>Total Payment</span>
            <strong id="displayPrice">Rs. 0</strong>
        </div>
        <button class="checkout-btn" onclick="proceedCheckout()">Top Up Now</button>
    </div>

    <script>
        let selectedPackageName = '';
        let selectedPackagePrice = '';

        function selectPackage(element, name, price) {
            // Remove 'selected' class from all cards
            document.querySelectorAll('.coin-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add 'selected' to clicked card
            element.classList.add('selected');
            
            selectedPackageName = name;
            selectedPackagePrice = price;

            // Update bottom price
            document.getElementById('displayPrice').innerText = price;
        }

        function proceedCheckout() {
            const userId = document.getElementById('userId').value.trim();

            if (!userId) {
                alert('Please enter your TikTok User ID first!');
                document.getElementById('userId').focus();
                return;
            }

            if (!selectedPackageName) {
                alert('Please select a coin package!');
                return;
            }

            alert(`Processing top-up for:\nUser ID: ${userId}\nPackage: ${selectedPackageName}\nPrice: ${selectedPackagePrice}`);
        }
    </script>
</body>
</html>
